name: seekora-agent
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - "fastapi>=0.115,<1"
      - "httpx>=0.27,<1"
      - "langchain>=1.3,<2"
      - "langchain-openai>=1.1,<2"
      - "langgraph>=1.2,<2"
      - "pydantic>=2.9,<3"
      - "pydantic-settings>=2.6,<3"
      - "uvicorn>=0.30,<1"
      - -e .
